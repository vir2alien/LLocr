<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle with 22% corner radius -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#2B3A55" />

  <!-- Main Container / Safe Margin Wrapper -->
  <g transform="translate(64, 64)">
    <!-- OCR Scanning Frame (4 Corner Brackets) - Thick, Minimalist, High Contrast -->
    <!-- Top-Left Bracket -->
    <path d="M 40,96 L 40,40 L 96,40" fill="none" stroke="#F2994A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top-Right Bracket -->
    <path d="M 288,40 L 344,40 L 344,96" fill="none" stroke="#F2994A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Left Bracket -->
    <path d="M 40,288 L 40,344 L 96,344" fill="none" stroke="#F2994A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom-Right Bracket -->
    <path d="M 288,344 L 344,344 L 344,288" fill="none" stroke="#F2994A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Document Sheet -->
    <!-- Scaled and structured for extreme 16x16px legibility -->
    <rect x="104" y="88" width="176" height="208" rx="16" ry="16" fill="#FFFFFF" />

    <!-- Abstract Text Lines Transforming into Geometric Recognition Shapes -->
    <!-- Top Line: Raw Text Data (Thick, neutral, geometric block) -->
    <rect x="136" y="136" width="112" height="24" rx="8" ry="8" fill="#2B3A55" opacity="0.4" />

    <!-- Bottom Line: Processed/Recognized Data (Crisp, highlighted LLM output block) -->
    <rect x="136" y="192" width="112" height="24" rx="8" ry="8" fill="#2B3A55" />

    <!-- Accent 'Dot' or Target Node to anchor the "LLM/OCR connection" concept -->
    <circle cx="224" cy="204" r="20" fill="#F2994A" />
  </g>
</svg>
