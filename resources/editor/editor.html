<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 'unsafe-inline' in script-src is load-bearing: Vditor's asset loader
       fetches scripts over XHR and injects them as inline text nodes, so the
       lazy-loaded pieces (Lute, KaTeX, i18n, …) cannot run without it. The
       page is still fully local: qrc only, no network surface. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="vditor/dist/index.css">
  <link rel="stylesheet" href="vditor/dist/js/katex/katex.min.css">
  <script src="vditor/dist/js/katex/katex.min.js"></script>
  <script>window.onerror = function(message, source, line) { window.__err = message + '@' + line; return false; };</script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    #editor { height: 100%; }
    .ll-hl { background: var(--hl, rgba(255, 200, 0, 0.25)) !important; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vditor/dist/index.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
