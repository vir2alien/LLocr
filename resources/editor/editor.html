<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 'unsafe-inline' in script-src is load-bearing: Vditor's asset loader
       fetches scripts over XHR and injects them as inline text nodes, so the
       lazy-loaded pieces (Lute, KaTeX, i18n, …) cannot run without it. The
       page is still fully local: qrc only, no network surface. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="vditor/dist/index.css">
  <link rel="stylesheet" href="vditor/dist/js/katex/katex.min.css">
  <script src="vditor/dist/js/katex/katex.min.js"></script>
  <script>window.onerror = function(message, source, line) { window.__err = message + '@' + line; return false; };</script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    #editor { height: 100%; }
    .ll-hl { background: var(--hl, rgba(255, 200, 0, 0.25)) !important; }

    /* The editor's menu wears the app's tool sizes (ADR 302): the buttons are
       32×28 with an 18 px glyph — the size of the central panel's tools — the
       band is 36 px tall (the height of that panel's menu) and the first
       button stands 8 px from the edge. Vditor writes the toolbar's left
       padding itself (it compensates for the outline panel), so the rule has
       to outrank the inline style. */
    .vditor-toolbar {
      padding: 4px 8px !important;
      /* The hairline moves inside the band: the menu is then 36 px tall —
         the height of the central panel's menu. */
      border-bottom: none;
      box-shadow: inset 0 -1px 0 var(--border-color);
      --toolbar-height: 28px;
      --toolbar-divider-margin-top: 4px;
    }
    .vditor-toolbar__item { padding: 0; }
    .vditor-toolbar__item .vditor-tooltipped {
      width: 32px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vditor-toolbar__item svg { width: 18px; height: 18px; }

    /* Vditor switches its tooltips off in a pane narrower than 520 px — and
       the preview pane is exactly that narrow. The menu is the app's: its
       buttons say what they do. */
    .vditor-toolbar__item .vditor-tooltipped::after { content: attr(aria-label); }

    /* The outermost buttons would hang their tooltips over the edge of the
       page: the first one opens to the right, the last one to the left. The
       page measures the tips and pins the ones that would cross an edge. */
    .vditor-toolbar__item .ll-edge-left::after { left: 0; right: auto; transform: none; }
    .vditor-toolbar__item .ll-edge-right::after { right: 0; left: auto; transform: none; }
    .vditor-toolbar__item .ll-measure::after { display: inline-block !important; }

    /* The zoom: the text grows and shrinks, the menu keeps the app's size. */
    .vditor-toolbar__item.ll-zoom { float: right; display: flex; }
    .vditor-toolbar__item.ll-zoom .ll-zoom__label {
      width: auto;
      padding: 0 8px;
    }
    .vditor-toolbar__item.ll-zoom .ll-zoom__label span {
      font-size: 13px;
      color: var(--toolbar-icon-color);
    }
    .vditor-toolbar__item.ll-zoom svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vditor/dist/index.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
