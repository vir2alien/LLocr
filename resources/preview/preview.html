<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="katex.min.css">
  <script src="katex.min.js"></script>
  <script src="contrib/auto-render.min.js"></script>
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="preview.js"></script>
  <script src="purify.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 16px 20px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    table {
      border-collapse: collapse;
      margin: 12px 0;
      width: auto;
    }
    th, td {
      border: 1px solid var(--border, #ccc);
      padding: 6px 10px;
      text-align: left;
    }
    th { background: var(--th-bg, rgba(128,128,128,0.12)); }
    img { max-width: 100%; height: auto; }
    pre {
      background: var(--code-bg, rgba(128,128,128,0.12));
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    code { font-family: "SF Mono", Consolas, monospace; font-size: 0.9em; }
    blockquote {
      margin: 12px 0;
      padding-left: 12px;
      border-left: 3px solid var(--border, #ccc);
      color: var(--muted, #888);
    }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  </style>
</head>
<body>
  <div id="content"></div>
</body>
</html>
