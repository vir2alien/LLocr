# Continuous verification for LLocr — two tiers on purpose.
#
#   format          every push/PR: clang-format only, no Qt, ~30 s
#   build-and-test  workflow_dispatch only: configure → build → ctest → qmllint
#
# Both tiers go through `scripts/check.sh`, so the local and the CI sequence
# cannot drift (ADR 100). The full tier needs Qt 6.10.3, which the hosted
# runners do not have, and the provisioning step below is still a TODO — that
# is why the full matrix is manual. A per-push tier that cannot pass is worse
# than no CI: it only teaches the reader to ignore red.
#
#   TODO(provision-qt): install Qt 6.10.3 into ${{ matrix.qt_prefix }} with
#   jurplel/install-qt-action (aqtinstall; `cache: true`, the package with
#   WebEngine is ~2 GB) and drop the QT_PREFIX_* placeholders below, which
#   point at a workspace path nothing creates. Qt 6.10.3 is an *official*
#   online-installer build (components qt.qt6.6103.*), not a custom one, so it
#   is available from download.qt.io: per host the arch is gcc_64 (Linux,
#   plus modules qtwebengine + qtwebengine-dev-tools, and the WebEngine
#   runtime deps libnss3 libxss1 libasound2t64 libxtst6 libxkbcommon-x11-0
#   libxcomposite1 libxdamage1 libxrandr2 libgbm1 libatk1.0-0t64 libcups2t64
#   libdrm2 libpango-1.0-0), macos (universal) and msvc2022_64 (Windows,
#   which also needs ilammy/msvc-dev-cmd for the bash shell and vcpkg for
#   ZLIB, triplet x64-windows — see the Windows section of docs/06-dev-setup.md).
#   DjVu is optional: the suite builds and runs without it.

name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: clang-format
        run: scripts/check.sh --format-only

  build-and-test:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            qt_prefix: ${{ github.workspace }}/Qt/6.10.3/macos
          - name: Linux
            os: ubuntu-24.04
            qt_prefix: ${{ github.workspace }}/Qt/6.10.3/gcc_64
          - name: Windows
            os: windows-2022
            qt_prefix: C:/Qt/6.10.3/msvc2022_64

    steps:
      - uses: actions/checkout@v4

      # TODO(provision-qt): install Qt 6.10.3 into ${{ matrix.qt_prefix }}.
      - name: Show the Qt prefix in use
        shell: bash
        run: echo "QT_PREFIX=${{ matrix.qt_prefix }}"

      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev clang-format

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Configure, build, test, format check
        shell: bash
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
          BUILD_TYPE: Debug
        run: |
          set -euo pipefail
          export QT_PREFIX='${{ matrix.qt_prefix }}'
          # Reuses an existing tree and skips what it cannot run; the format
          # check is a hard gate here because clang-format is installed above.
          scripts/check.sh --configure

      - name: QML lint
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # qmllint from the Qt the project builds against — another one on PATH
          # has different .qmllint.ini keys. .qmllint.ini is resolved relative to
          # the analysed files, so run from the repository root.
          QMLLINT="${{ matrix.qt_prefix }}/bin/qmllint"
          [ -x "$QMLLINT" ] || QMLLINT="$(command -v qmllint || true)"
          if [ -z "$QMLLINT" ]; then
            echo "qmllint not available on this runner — skipped" >&2
            exit 0
          fi
          find resources/qml -name '*.qml' | sort > /tmp/llocr-qml-files.txt
          xargs "$QMLLINT" --max-warnings 0 -I build-ci/src < /tmp/llocr-qml-files.txt
