# qmllint configuration for the LLocr module.
#
# Run (from the repo root, after a build):
#   xargs ~/Qt/6.10.3/macos/bin/qmllint --max-warnings 0 -I build/src \
#       < <(find resources/qml -name '*.qml')
# `scripts/check.sh` does exactly this; CI runs it as a hard gate.
#
# Keys are the CamelCase directive names from `qmllint --write-defaults`
# (kebab-case spellings are silently ignored). Everything not listed here stays
# a warning, so a new unresolved type, a missing property or a syntax error
# fails the run.

[General]
MaxWarnings=0

[Warnings]
# The project's QML style is unqualified access by design (a component reads
# its own properties directly); qualifying 700+ accesses with ids would be a
# large, purely cosmetic diff. Info, not a gate.
UnqualifiedAccess=info

# Already `info` in the tool's defaults, kept explicit because it becomes
# meaningful later: qmllint cannot resolve `Controller`, `Settings`,
# `UiController`, … (they are registered by hand in main.cpp, not as module
# types), so it cannot see which types an `import LLocr` brings in and reports
# false "unused" verdicts — acting on them broke the Layouts usage in
# Setup/StepWelcome and Setup/StepExternal. Raise to `warning` once the C++
# singletons are module types with create() factories (stage 4).
UnusedImports=info
